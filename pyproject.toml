[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-skill-kit"
version = "0.9.1"
description = "CLI to write an agent skill once and deploy it to Claude Code, Codex, Gemini CLI, Cursor and Antigravity"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = [
    "ai", "agents", "agent-skills", "skills", "cli", "package-manager",
    "codex", "gemini", "claude", "claude-code", "cursor", "antigravity", "mcp",
]
authors = [
    { name = "Navanithan S", email = "gua@navins.biz" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage      = "https://navanithans.github.io/Agent-Skill-Kit/"
Documentation = "https://navanithans.github.io/Agent-Skill-Kit/docs/"
Repository    = "https://github.com/NavanithanS/Agent-Skill-Kit"
Changelog     = "https://github.com/NavanithanS/Agent-Skill-Kit/blob/master/CHANGELOG.md"
Issues        = "https://github.com/NavanithanS/Agent-Skill-Kit/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "tiktoken>=0.5.0",
]
mcp = [
    "mcp>=1.0.0",
]

[project.scripts]
ask = "ask.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ask", "agents", "skills"]
